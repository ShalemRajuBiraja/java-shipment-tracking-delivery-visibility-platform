# In-memory DB for local UI testing when PostgreSQL password is not configured.
# Run: mvnw spring-boot:run -Dspring-boot.run.profiles=dev-h2

spring.datasource.url=jdbc:h2:mem:shiptrack;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Placeholders so the app starts without real map API keys (demo shipment skips geocoding)
locationiq.api-key=local-dev-placeholder
google.maps.api-key=local-dev-placeholder
